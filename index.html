<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lembra Aí · Agenda online para autônomos</title>
<meta name="description" content="Seu link de agendamento: o cliente escolhe o horário e ele cai direto na sua agenda.">
<meta name="theme-color" content="#0A0B0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lembra Aí">
<link rel="manifest" href="manifest.webmanifest" id="mf">
<link rel="icon" href="icon-192.png" id="fav">
<link rel="apple-touch-icon" href="icon-180.png" id="ati">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0A0B0E;--card:#121419;--card2:#181B22;--ink:#F3F0E9;--mute:#9C978C;--line:rgba(255,255,255,.08);--line2:rgba(216,184,120,.28);--gold:#D8B878;--gd:#E9CF98;--goldg:linear-gradient(135deg,#F4DFAF 0%,#D8B878 45%,#A8823F 100%);--ok:#46D99B;--g2:rgba(216,184,120,.10);--warn:rgba(255,196,87,.12);--warnk:#FFC457;--bad:rgba(255,107,94,.12);--badk:#FF7B6E;--sf:'Instrument Serif',Georgia,serif;--ss:'Manrope',system-ui,sans-serif;--glass:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));--onp:#17120A}
:root[data-tema=light]{color-scheme:light;--bg:#F5F3EE;--card:#FFFFFF;--card2:#FBFAF7;--ink:#121212;--mute:#6B675F;--line:rgba(0,0,0,.09);--line2:rgba(156,122,60,.35);--gold:#9C7A3C;--gd:#7E602A;--goldg:linear-gradient(135deg,#C29A55 0%,#8E6B2E 100%);--ok:#178A5B;--g2:rgba(156,122,60,.08);--warnk:#9A6A00;--badk:#C2362B;--glass:linear-gradient(180deg,#fff,#fff);--onp:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);font:15.5px/1.55 var(--ss);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;min-height:100vh}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(60% 60% at 70% 0%,rgba(216,184,120,.10),transparent 70%);pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
a{color:var(--gold);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-family:var(--sf);font-weight:400;font-size:clamp(34px,6vw,50px);line-height:1.04;letter-spacing:-.01em}
h1 em,.serif{font-family:var(--sf);font-style:italic;font-weight:400}
h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--mute);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2 .tag{margin-left:auto}
h3{font-size:17px;font-weight:700}
.mut,.sub{color:var(--mute)}.sub{font-size:16px}
.num{font-family:var(--sf);font-weight:400;line-height:1}
.gold{background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);padding:26px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
main{max-width:820px;width:100%;padding:clamp(20px,4vw,48px) clamp(16px,4vw,40px) 140px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--sf);font-size:25px;margin:0 8px 30px}
nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14.5px;margin-bottom:4px}
nav a svg,.mobnav svg{width:20px;height:20px}
nav a.on{background:var(--g2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}nav a.on svg,.mobnav a.on svg{color:var(--gold)}
.mobnav{display:none}
@media(max-width:820px){.app{display:block}aside{display:none}
 .mobnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,13,17,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 :root[data-tema=light] .mobnav{background:rgba(255,255,255,.9)}
 .mobnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--mute);text-decoration:none;font-size:11.5px;font-weight:700}.mobnav a.on{color:var(--ink)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .15s,border-color .2s,filter .2s;white-space:nowrap}
.btn:hover{border-color:var(--line2)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;cursor:default}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--goldg);color:var(--onp);border:0;box-shadow:0 10px 30px -12px rgba(216,184,120,.55)}.btn.pri:hover{filter:brightness(1.06)}
.btn.ok{color:var(--ok);border-color:rgba(70,217,155,.35);background:transparent}
.btn.dang{color:var(--badk);border-color:rgba(255,107,94,.35);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--gold);padding:0 8px}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.box{background:var(--glass),var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.box+.box{margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--g2);border:1px solid var(--line2);color:var(--gd)}
.tag.soft{background:transparent;border-color:var(--line);color:var(--mute)}.tag.ok{background:rgba(70,217,155,.1);border-color:transparent;color:var(--ok)}.tag.bad{background:var(--bad);border-color:transparent;color:var(--badk)}.tag.warn{background:var(--warn);border-color:transparent;color:var(--warnk)}
label{display:block;font-weight:600;color:var(--mute);font-size:13px;margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:6px;min-height:50px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:16px;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px var(--g2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ddd{display:grid;grid-template-columns:86px 1fr;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-weight:500;font-size:14px}.check input{width:20px;height:20px;min-height:0;margin:2px 0 0;flex:none;accent-color:#D8B878}
.err{color:var(--badk);font-size:14px;min-height:20px;margin:4px 0}
.empty{border:1px dashed var(--line);border-radius:20px;color:var(--mute);text-align:center;padding:22px;font-size:15px}
.fade{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}.f2{animation-delay:.07s}.f3{animation-delay:.14s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}@keyframes fadeIn{from{opacity:0}}
/* modal e toast */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:12px}
#modal.on{display:flex;animation:fadeIn .2s}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:26px;padding:22px;box-shadow:0 40px 120px -30px #000}
@media(min-width:821px){#modal{align-items:center}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);opacity:0;z-index:80;background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(92vw,440px);transition:.25s;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* splash */
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}#splash .nm{font-family:var(--sf);font-size:38px;text-align:center;margin-top:14px}
/* entrada */
.auth{max-width:460px;margin:0 auto;padding:clamp(24px,6vh,70px) 20px 60px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;background:var(--card2);padding:4px;margin:20px 0}
.seg button{border:0;background:none;min-height:42px;border-radius:10px;font-weight:700;color:var(--mute);cursor:pointer}.seg .on{background:var(--goldg);color:var(--onp)}
.accs{display:grid;gap:8px;margin-bottom:12px}.acc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card2);cursor:pointer;text-align:left;width:100%}
.acc.on{border-color:var(--gold)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--goldg);color:var(--onp);font-weight:800;font-size:15px;flex:none;font-family:var(--ss)}
.av.lg{width:84px;height:84px;font-size:30px;font-family:var(--sf);font-weight:400;box-shadow:0 20px 50px -20px rgba(216,184,120,.6)}
/* tour */
.tour{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;max-width:560px;margin:0 auto;padding:26px 22px calc(24px + env(safe-area-inset-bottom))}
.tour .sl{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.tour h1{font-size:clamp(38px,10vw,54px)}.tour .lead{font-size:17px;color:var(--mute)}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}.dots i.on{width:26px;background:var(--goldg)}
.mock{border-radius:22px;border:1px solid var(--line);background:var(--glass),var(--card);padding:14px;display:grid;gap:10px}
.notif{display:flex;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px}
.notif .ic{width:38px;height:38px;border-radius:11px;background:var(--goldg);display:grid;place-items:center;flex:none;color:var(--onp)}.notif .ic svg{width:20px;height:20px}
.notif b{display:block;font-size:14px}.notif span{font-size:12.5px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);color:var(--gd);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700}
/* início do profissional */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:22px}.hdr .hi{font-size:14px;color:var(--mute)}.hdr .hi b{display:block;color:var(--ink);font-size:17px}
.shield{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);border:1px solid rgba(70,217,155,.28);border-radius:99px;padding:6px 10px;white-space:nowrap}
.value{border-radius:28px;padding:22px;background:radial-gradient(120% 90% at 100% 0%,rgba(216,184,120,.16),transparent 55%),var(--glass),var(--card);border:1px solid var(--line2)}
.value .k,.k{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.value .big{font-size:clamp(48px,12vw,72px);margin:8px 0 4px}.value .cap{color:var(--mute);font-size:14.5px}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.vgrid div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:12px}:root[data-tema=light] .vgrid div{background:var(--card2)}
.vgrid b{display:block;font-family:var(--sf);font-size:26px;font-weight:400;line-height:1.05}.vgrid span{display:block;font-size:11.5px;color:var(--mute);font-weight:600;margin-top:4px;line-height:1.3}
.roi{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}.roi b{color:var(--ink)}.roi .x{font-family:var(--sf);font-size:28px;line-height:1;flex:none;padding:2px 4px 4px 0}
.linkc{margin-top:14px;border-radius:22px;border:1px solid var(--line);padding:16px;background:var(--glass),var(--card)}
.linkc .u{font-weight:700;font-size:15px;word-break:break-all;margin:6px 0 12px}
.trial{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:-8px 0 14px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);font-size:13.5px;color:var(--mute);text-decoration:none;font-weight:500}
.trial b{color:var(--gold);white-space:nowrap}.trial.urg{border-color:rgba(255,196,87,.4);background:var(--warn);color:var(--ink)}
/* dias e horários */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:10px 0;text-align:center;cursor:pointer;scroll-snap-align:start}
.day small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}.day b{display:block;font-family:var(--sf);font-size:26px;font-weight:400;line-height:1.1}
.day.on{background:var(--goldg);border-color:transparent;color:var(--onp)}.day.on small{color:var(--onp);opacity:.75}.day.off{opacity:.35;cursor:default}.day .dt{width:5px;height:5px;border-radius:50%;background:var(--gold);margin:3px auto 0}.day.on .dt{background:var(--onp)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:15px;cursor:pointer}.slot:hover{border-color:var(--gold)}.slot.on{background:var(--goldg);color:var(--onp);border-color:transparent}
/* cliente */
.pub{max-width:640px;margin:0 auto;padding:clamp(20px,5vw,44px) 18px 120px}
.phd{text-align:center;padding:10px 0 6px}.phd .av{margin:0 auto 14px}.phd h1{font-size:clamp(36px,9vw,48px)}.phd .pr{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.phd p{color:var(--mute);max-width:460px;margin:10px auto 0}
.svc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--glass),var(--card);cursor:pointer;width:100%;text-align:left}
.svc+.svc{margin-top:10px}.svc:hover,.svc.on{border-color:var(--gold)}
.svc b{font-size:16.5px}.svc .d{font-size:13.5px;color:var(--mute)}.svc .p{font-family:var(--sf);font-size:24px;grid-row:1/3;grid-column:2}
.step{display:flex;align-items:center;gap:10px;margin:28px 0 12px}.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:var(--g2);color:var(--gold);border:1px solid var(--line2)}
.step span{font-weight:700;font-size:16px}
.resumo{border-radius:22px;border:1px solid var(--line2);padding:18px;background:radial-gradient(120% 90% at 100% 0%,rgba(216,184,120,.12),transparent 60%),var(--card)}
.resumo .q{font-family:var(--sf);font-size:30px;line-height:1.1;margin:6px 0}
.foot{text-align:center;color:var(--mute);font-size:13px;margin-top:40px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.bar .btn{width:min(608px,100%);margin:0 auto;display:flex;min-height:56px;font-size:16px}
/* agenda do profissional */
.ag{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--glass),var(--card);cursor:pointer}
.ag+.ag{margin-top:10px}.ag .h{font-family:var(--sf);font-size:24px;line-height:1}.ag .h small{display:block;font-family:var(--ss);font-size:11.5px;color:var(--mute);margin-top:4px}
.ag .n{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ag .s{font-size:13px;color:var(--mute)}
.ag.x{opacity:.5}.ag.x .n{text-decoration:line-through}
.livre{padding:10px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--mute);font-size:13.5px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.wk{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}.wk .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.wk input[type=time]{width:112px;min-height:42px;margin:0;padding:8px 10px}
.wk .check{margin:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row .g{flex:1;min-width:0}
/* selo */
#party{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(5,6,8,.8);backdrop-filter:blur(8px);cursor:pointer;animation:fadeIn .25s;text-align:center;padding:24px}
:root[data-tema=light] #party{background:rgba(245,243,238,.88)}
#party .seal{width:176px;height:176px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:var(--goldg);box-shadow:0 30px 80px -20px rgba(216,184,120,.6);animation:sealIn .8s cubic-bezier(.2,.9,.2,1)}
#party .seal div{width:150px;height:150px;border-radius:50%;border:1.5px dashed rgba(23,18,10,.45);display:grid;place-items:center;align-content:center;font-family:var(--sf);font-style:italic;font-size:34px;color:#17120A;line-height:1}
#party .seal small{display:block;font-family:var(--ss);font-style:normal;font-size:10px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;margin-top:6px}
#party h2{display:block;font-family:var(--sf);font-weight:400;text-transform:none;letter-spacing:0;font-size:32px;color:var(--ink);margin:0 0 6px}#party p{color:var(--mute)}
@keyframes sealIn{from{transform:scale(1.6) rotate(-25deg);opacity:0}60%{transform:scale(.95) rotate(3deg);opacity:1}to{transform:none}}
/* plano */
.price{margin-top:14px;border-radius:26px;border:1px solid var(--line2);padding:22px;background:radial-gradient(120% 80% at 0% 0%,rgba(216,184,120,.12),transparent 60%),var(--card)}
.price .pv{display:flex;align-items:baseline;gap:6px;margin:6px 0 8px}.price .pv .num{font-size:56px}.price .pv small{color:var(--mute);font-weight:600}
.price ul{list-style:none;margin:18px 0;display:grid;gap:10px}.price li{display:flex;gap:10px;font-size:14.5px}.price li span{color:var(--ok);font-weight:800}
/* concierge */
.cc-btn{position:fixed;right:16px;bottom:92px;z-index:30;display:flex;align-items:center;gap:10px;background:var(--card2);color:var(--ink);border:1px solid var(--line2);border-radius:40px;padding:0 18px 0 6px;height:54px;font:700 14px var(--ss);cursor:pointer;box-shadow:0 18px 40px -16px rgba(0,0,0,.7)}
.cc-btn .em{width:42px;height:42px;border-radius:50%;background:var(--goldg);display:grid;place-items:center;color:var(--onp)}.cc-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(70,217,155,.18)}
.cc{position:fixed;z-index:60;right:0;top:0;bottom:0;width:min(430px,100%);background:var(--card);border-left:1px solid var(--line2);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.cc.on{transform:none}
.cc-hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.cc-hd .em{width:44px;height:44px;border-radius:50%;background:var(--goldg);display:grid;place-items:center;color:var(--onp);flex:none}
.cc-hd b{font-family:var(--sf);font-size:25px;font-weight:400;display:block;line-height:1}.cc-hd span{font-size:12px;font-weight:700;color:var(--ok)}

async function loadMe(){
  const {data:{session}}=await sb.auth.getSession();const user=session?.user;
  if(!user){UID=null;ME=null;PROF=null;PL=null;return false}

  const [p,pr,pl]=await Promise.all([sb.from('profiles').select('nome,whatsapp,canais').eq('id',UID).maybeSingle(),sb.from('profissionais').select('*').eq('id',UID).maybeSingle(),sb.from('assinaturas').select('status,teste_fim,valor').eq('user_id',UID).maybeSingle()]);

  PROF=pr.data||null;PL=pl.data||null;ACC.last=user.email;saveAcc();

}
async function loadProf(){
  const de=new Date(Date.now()-35*864e5).toISOString(),ate=new Date(Date.now()+130*864e5).toISOString();

async function ativarPush(silent){

    const j=sub.toJSON(),{error}=await sb.from('push_subs').insert({user_id:UID,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth});

async function salvarSetup(f){

    const {data:livre}=await sb.rpc('slug_livre',{p_slug:slug});if(!livre)throw new Error(`O link "${slug}" já está em uso. Tente outro, como ${slug}-${Math.floor(Math.random()*90+10)}.`);

    r=await sb.from('servicos').insert({prof_id:UID,nome:String(v.snome).trim()||'Atendimento',duracao_min:+v.sdur,preco:isNaN(preco)?null:preco});if(r.error)throw r.error;

    if(H.length){r=await sb.from('horarios').insert(H.map(h=>({...h,prof_id:UID})));if(r.error)throw r.error}
    await loadMe();location.hash=H.length?'inicio':'ajustes';render();celebrar('Pronto','Sua agenda está no ar.','Agora é só enviar seu link aos clientes.');

 [['horario','dias','expediente','almoco','atendo','sabado'],'Em <b>Ajustes → Dias e horários</b> você marca os dias em que atende e até dois períodos por dia (por exemplo, manhã e tarde, com pausa para o almoço).',[['Abrir Ajustes','#ajustes']]],
 [['folga','ferias','feriado','bloquear','fechar agenda'],'Para férias, feriado ou um horário que você não pode, use <b>Bloquear</b>. Nesse período o link não mostra horários livres.',[['Bloquear um período','folga']]],
 [['encaixe','manual','telefone','marcar para cliente'],'Cliente marcou por telefone? Toque em <b>Encaixe</b>, coloque o nome, o serviço e a hora. O horário some do link na hora.',[['Fazer encaixe','encaixe']]],
 [['cancel','desmarcar'],'Para cancelar, toque no agendamento e em <b>Cancelar horário</b>. O cliente pode cancelar pelo app até o prazo que você define em Ajustes → Regras.',[['Abrir agenda','#agenda']]],
 [['calendario','iphone','google agenda','agenda do celular'],'Em <b>Ajustes → Agenda no calendário do celular</b> você liga o Calendário do iPhone ou o Google Agenda. Os atendimentos aparecem lá sozinhos.',[['Abrir Ajustes','#ajustes']]],
 [['notifica','aviso','alerta','push'],'Você recebe aviso a cada agendamento e cancelamento: no celular, por e-mail e por WhatsApp (escolha em Ajustes). No iPhone, primeiro instale o app pela Tela de Início.',[['Ativar no celular','push']]],
 [['lembrete','falta','faltou','no-show'],'O cliente recebe confirmação na hora e lembrete antes do horário, o que ajuda a diminuir as faltas. Depois do atendimento, marque Concluído ou Faltou para acompanhar seus números.',[]],
 [['intervalo','antecedencia','regra','prazo'],'Em <b>Ajustes → Regras</b> você define o intervalo entre atendimentos, com quanta antecedência o cliente pode marcar, até quantos dias à frente a agenda fica aberta e até quando ele pode cancelar.',[['Abrir Ajustes','#ajustes']]],
 [['instalar','app do cliente','baixar','loja'],'Não precisa de loja. O cliente abre seu link e toca em "Instalar o app"; no iPhone é Compartilhar → Adicionar à Tela de Início. O ícone aparece com as suas iniciais e o seu nome.',[]],
 [['plano','assinatura','quanto custa','pagar','teste','gratis','cancelar plano'],'Você tem 14 dias grátis. Depois, '+brl(PRECO)+' por mês pelo Mercado Pago, e dá para cancelar quando quiser em Ajustes → Seu plano.',[['Ver plano','#plano']]],
 [['face id','digital','senha','entrar'],'Em Ajustes você ativa a entrada com '+bioNome+'. Se esqueceu a senha, toque em "Esqueci minha senha" na tela de entrada.',[['Abrir Ajustes','#ajustes']]],
 [['excluir','apagar','privacidade','dados','lgpd'],'Você pode apagar sua conta e todos os dados a qualquer momento em Ajustes → Excluir minha conta.',[['Privacidade','#privacidade']]]];
function ccDados(q){const ag=Date.now();
  if(/hoje/.test(q)){const h=AGS.filter(a=>dKey(a.inicio)===hoje()&&a.status==='confirmado');return [h.length?`Hoje você tem ${h.length}: `+h.map(a=>`<b>${hm(a.inicio)}</b> ${esc(first(a.cliente_nome))}`).join(', ')+'.':'Nenhum atendimento hoje.',[['Abrir agenda','#agenda']]]}
  if(/amanha/.test(q)){const k=addD(hoje(),1),h=AGS.filter(a=>dKey(a.inicio)===k&&a.status==='confirmado');return [h.length?`Amanhã: `+h.map(a=>`<b>${hm(a.inicio)}</b> ${esc(first(a.cliente_nome))}`).join(', ')+'.':'Nada marcado para amanhã ainda.',[]]}
  if(/proxim/.test(q)){const a=AGS.find(a=>a.status==='confirmado'&&Date.parse(a.inicio)>ag);return [a?`O próximo é <b>${esc(a.cliente_nome)}</b>, ${quando(dKey(a.inicio)).toLowerCase()} às ${hm(a.inicio)} (${esc(a.servico_nome)}).`:'Nenhum agendamento futuro.',a?[['Ver detalhes','ag:'+a.id]]:[]]}
  if(/quanto|fatur|mes/.test(q)&&!/custa|plano/.test(q)){const M=mesStats();return [`Neste mês: <b>${M.n}</b> atendimentos${M.fat?`, <b>${brl(M.fat)}</b> agendados`:''}, ${M.link} pelo link e ${M.faltas} ${M.faltas===1?'falta':'faltas'}.`,[]]}
  return null}
function ccResp(t){const q=noAc(t),d=ccDados(q);if(d)return d;let best=null,sc=0;CCKB.forEach(([ks,a,go])=>{const s=ks.reduce((n,k)=>n+(q.includes(noAc(k))?k.length:0),0);if(s>sc){sc=s;best=[a,go]}});
  return best||['Ainda não sei responder isso com certeza. Posso ajudar com link, serviços, horários, folgas, encaixes, cancelamentos, calendário do celular, avisos, plano e conta.',[]]}
const CC={log:[]};const CCCH=['Quem tenho hoje?','Qual o próximo?','Como divulgo meu link?','Como bloqueio um dia?','Como faço um encaixe?','Calendário do iPhone'];
function ccDraw(){const l=$('.cc-log');if(!l)return;l.innerHTML=CC.log.map(([w,h,go])=>`<div class="msg ${w}">${h}${go.length?'<br>'+go.map(([t,a])=>`<button class="go" data-ccgo="${esc(a)}">${esc(t)} →</button>`).join(''):''}</div>`).join('');l.scrollTop=l.scrollHeight}
function ccMsg(w,h,go){CC.log.push([w,h,go||[]]);ccDraw()}
function ccMount(show){let b=$('.cc-btn'),p=$('.cc');if(!show){b&&b.remove();p&&p.remove();return}
  if(!b){b=document.createElement('button');b.className='cc-btn';b.type='button';b.dataset.cc='1';b.setAttribute('aria-label','Abrir concierge 24 horas');b.innerHTML=`<span class="em">${ic.chat}</span><span class="lb">Concierge</span><span class="dot"></span>`;document.body.appendChild(b)}
  if(!p){p=document.createElement('aside');p.className='cc';p.setAttribute('aria-label','Concierge');p.innerHTML=`<div class="cc-hd"><span class="em">${ic.chat}</span><div><b>Concierge</b><span>● Disponível 24 horas</span></div><button type="button" data-ccx aria-label="Fechar">×</button></div><div class="cc-log" aria-live="polite"></div><div class="cc-chips">${CCCH.map(c=>`<button type="button" data-ccq="${c}">${c}</button>`).join('')}</div><form class="cc-in" id="fcc"><input name="q" placeholder="Pergunte qualquer coisa" autocomplete="off" aria-label="Sua pergunta"><button class="btn pri" aria-label="Enviar">${ic.send}</button></form>`;document.body.appendChild(p)}}
function ccAbrir(){$('.cc').classList.add('on');if(!CC.log.length)ccMsg('bot',`${saud()}, ${esc(first(ME.nome))}. Sou o concierge do ${APP}. Pergunte sobre qualquer função ou sobre a sua agenda.`);else ccDraw()}
const ccFechar=()=>$('.cc')?.classList.remove('on');
function ccPerg(t){if(!t.trim())return;ccMsg('me',esc(t));const [a,go]=ccResp(t);setTimeout(()=>ccMsg('bot',a,go),300)}
function ccGo(a){ccFechar();if(a.startsWith('#'))return location.hash=a.slice(1);if(a.startsWith('ag:'))return abrirAg(a.slice(3));({folga:()=>formFolga(hoje()),encaixe:()=>formEncaixe(),push:()=>ativarPush(),bio:()=>ativarBio()})[a]?.()}

/* ===== render ===== */
function render(){
  const r=location.hash.slice(1),root=$('#root');
  if(r==='termos'||r==='privacidade'){ccMount(false);root.innerHTML=vDoc(r);window.scrollTo(0,0);return}
  if(REC){ccMount(false);root.innerHTML=vNovaSenha();return}
  if(SLUG){ccMount(false);root.innerHTML=renderCliente(r);return}
  if(r==='plano-ok'&&!UID)st('lembraai_planook',1);
  if(!UID){ccMount(false);if(r==='meus')return root.innerHTML=`<div class="pub">${vMeus()}</div>`;if(!tourVisto())return root.innerHTML=vTour();return root.innerHTML=vAuth()}
  if(!PROF){ccMount(false);if(r==='meus')return root.innerHTML=`<div class="pub">${vMeus()}</div>`;return root.innerHTML=vSetupProf()}
  if(ld('lembraai_planook')&&r!=='plano-ok'){st('lembraai_planook',0);localStorage.removeItem('lembraai_planook');return location.hash='plano-ok'}
  if(r==='plano-ok'){ccMount(false);root.innerHTML=`<div style="text-align:center;padding-top:20vh">${emblema(64)}<h1 style="margin-top:18px">Confirmando seu <em>pagamento…</em></h1><p class="sub">Leva só alguns segundos.</p></div>`;if(!render.conf){render.conf=1;confirmarPlano(0)}return}
  if(r==='plano'||(!acesso()&&r!=='ajustes')){ccMount(false);root.innerHTML=`<main style="margin:0 auto">${vPlano()}</main>`;window.scrollTo(0,0);return}
  if(r.startsWith('ag-')){const id=r.slice(3);history.replaceState(null,'',location.pathname+location.search+'#inicio');render();return abrirAg(id)}
  const n=navProf(r),body={inicio:vInicio,agenda:vAgenda,link:vLink,ajustes:vAjustes}[n.b]();
  root.innerHTML=`<div class="app">${n.aside}<main>${body}</main></div>${n.mob}`;ccMount(true);
  if(n.b==='agenda'){const s=$('#dstrip .on');if(s)s.scrollIntoView({inline:'center',block:'nearest'})}
}
addEventListener('hashchange',()=>{closeM();if(SLUG&&location.hash.slice(1)==='meus')MEUS=null;if(SLUG&&!location.hash.slice(1)){BK.ok=null;BK.ocup=null}render();window.scrollTo(0,0)});

/* ===== cliques ===== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a,[data-ag],[data-serv]');if(!t)return;const d=t.dataset;
  if('stop' in d)return e.stopPropagation();
  if('aumodo' in d){AU.modo=d.aumodo;if(t.closest('.sheet'))return confirmar(true);return render()}
  if('esqueci' in d){e.preventDefault();return esqueci()}
  if('biologin' in d)return entrarBio();
  if('tournext' in d){if(TOUR.i<TOURS.length-1){TOUR.i++;return render()}st('lembraai_tour',1);AU.modo='novo';return render()}
  if('tourskip' in d){e.preventDefault();st('lembraai_tour',1);AU.modo='entrar';return render()}
  if('sair' in d){e.preventDefault();return sair()}
  if('excluir' in d)return excluirConta();
  if('tema' in d){setTheme(d.tema);return render()}
  if('push' in d)return ativarPush();
  if('instalar' in d)return instalar();
  if('bioon' in d)return ativarBio();
  if('biooff' in d)return desativarBio();
  if('assinar' in d)return assinar(t);
  if('cancplano' in d)return cancelarPlano();
  if(d.cc)return $('.cc').classList.contains('on')?ccFechar():ccAbrir();
  if('ccx' in d)return ccFechar();
  if(d.ccq)return ccPerg(d.ccq);
  if(d.ccgo)return ccGo(d.ccgo);
  if('voltar' in d&&history.length>1){e.preventDefault();return history.back()}
  /* cliente */
  if(d.serv){const s=PUB.servicos.find(x=>x.id===d.serv);if(BK.serv&&BK.serv.id===s.id&&BK.ocup)return;BK.serv=s;BK.dia=null;BK.hora=null;render();if(!BK.ocup){await loadOcup();render()}return}
  if('trocaserv' in d){BK.serv=null;BK.hora=null;return render()}
  if(d.dia){BK.dia=d.dia;BK.hora=null;render();return}
  if(d.hora){BK.hora=d.hora;render();return}
  if('confirmar' in d)return confirmar();
  if('ics' in d){const o=BK.ok,i=at(o.dia,o.hora);return baixarIcs({uid:o.id+'@lembraai',ini:i,fim:new Date(+i+o.serv.duracao_min*6e4),titulo:o.serv.nome+' · '+PUB.nome,local:PUB.endereco||''})}
  if('novoag' in d){BK.ok=null;BK.serv=null;return render()}
  if(d.cancmeu)return ask('Cancelar este horário?',async()=>{const {error}=await sb.rpc('cancelar_agendamento',{p_id:d.cancmeu});if(error)return toast(errTxt(error));MEUS=null;BK.ocup=null;render();toast('Horário cancelado')},'Cancelar horário');
  if(d.icsmeu){const a=MEUS.find(x=>x.id===d.icsmeu);return baixarIcs({uid:a.id+'@lembraai',ini:a.inicio,fim:a.fim,titulo:a.servico_nome+' · '+a.prof_nome,local:a.endereco||''})}
  /* profissional */
  if(d.ag&&!e.target.closest('[data-stop]'))return abrirAg(d.ag);
  if('sharelink' in d){e.preventDefault();const ok=await compartilhar(`Agende seu horário com ${PROF.nome}`,linkDe(PROF.slug));if(ok){st('lembraai_compart',1);if(location.hash.slice(1)==='inicio'||!location.hash)render()}return}
  if('copylink' in d){st('lembraai_compart',1);return copiar(linkDe(PROF.slug),'Link copiado. Cole no Instagram ou no WhatsApp.')}
  if('copymsg' in d){st('lembraai_compart',1);return copiar(`Olá! Agora você pode marcar seu horário comigo direto pelo app, quando quiser: ${linkDe(PROF.slug)}`,'Mensagem copiada')}
  if('marcaComp' in d){st('lembraai_compart',1);return}
  if('ical' in d){st('lembraai_ical',1);return}
  if(d.copyical){st('lembraai_ical',1);return copiar(d.copyical,'Link do calendário copiado')}
  if(d.feat){const k=d.feat;if(k==='push')return ativarPush();if(k==='bio')return ativarBio();if(k==='compartilhado')return location.hash='link';if(k==='ical')return location.hash='ajustes'}
  if('encaixe' in d)return formEncaixe();
  if(d.folga)return formFolga(d.folga);
  if(d.adia){AGD.dia=d.adia;return render()}
  if('novoserv' in d)return formServ();
  if(d.editserv)return formServ(SERV.find(s=>s.id===d.editserv));
  if(d.delserv)return ask('Excluir este serviço? Agendamentos já feitos continuam na agenda.',async()=>{const {error}=await sb.from('servicos').delete().eq('id',d.delserv);if(error)return toast(errTxt(error));await loadProf();render();toast('Serviço excluído')},'Excluir');
  if(d.delfolga){const {error}=await sb.from('folgas').delete().eq('id',d.delfolga);if(error)return toast(errTxt(error));await loadProf();return render()}
  if(d.stag){const {error}=await sb.rpc('marcar_status',{p_id:d.id,p_status:d.stag});if(error)return toast(errTxt(error));closeM();await loadProf();render();return toast(d.stag==='concluido'?'Marcado como concluído':d.stag==='faltou'?'Falta registrada':'Desfeito')}
  if(d.cancag)return ask('Cancelar este horário? O cliente recebe um aviso.',async()=>{const {error}=await sb.rpc('cancelar_agendamento',{p_id:d.cancag});if(error)return toast(errTxt(error));await loadProf();render();toast('Horário cancelado')},'Cancelar horário');
});
document.addEventListener('change',e=>{if(e.target.matches('[data-togglehoras]'))$('#fhrs').style.display=e.target.checked?'none':'grid'});
/* ===== formulários ===== */
document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='fcc'){ccPerg(f.q.value);f.q.value='';return}
  if(f.id==='fauth')return enviarAuth(f);
  if(f.id==='fsetup')return salvarSetup(f);
  const v=Object.fromEntries(new FormData(f));
  if(MCB&&f.closest('#sheet'))return MCB(v,f);
  if(f.id==='fnova'){const er=t=>$('#nerr').textContent=t;if(v.s1.length<6)return er('A senha precisa ter pelo menos 6 caracteres.');if(v.s1!==v.s2)return er('As senhas não são iguais.');
    const {error}=await sb.auth.updateUser({password:v.s1});if(error)return er(errTxt(error));REC=false;history.replaceState(null,'',location.pathname+location.search);await loadMe();render();return toast('Senha alterada')}
  if(f.id==='fmeu'){const w=String(v.ddd).replace(/\D/g,'')+String(v.num).replace(/\D/g,'');if(w.length<10)return toast('Celular com DDD incompleto');
    const {error}=await sb.from('profiles').update({nome:String(v.nome).trim(),whatsapp:w}).eq('id',UID);if(error)return toast(errTxt(error));ME.nome=String(v.nome).trim();ME.whats=w;render();return toast('Dados salvos')}
  if(f.id==='fperfil'){const slug=slugify(v.slug),row={nome:String(v.nome).trim(),profissao:String(v.profissao).trim()||null,bio:String(v.bio).trim()||null,endereco:String(v.endereco).trim()||null,whatsapp:String(v.whatsapp).replace(/\D/g,'')||null,slug};
    if(slug!==PROF.slug){const {data:livre}=await sb.rpc('slug_livre',{p_slug:slug});if(!livre)return f.querySelector('.err').textContent='Esse link já está em uso.'}
    const {error}=await sb.from('profissionais').update(row).eq('id',UID);if(error)return f.querySelector('.err').textContent=errTxt(error);Object.assign(PROF,row);render();return toast('Perfil salvo')}
  if(f.id==='fhor'){const H=[];for(const d of [0,1,2,3,4,5,6]){if(!v['on'+d])continue;if(v['a'+d]&&v['b'+d]){if(v['b'+d]<=v['a'+d])return toast(`${DL[d]}: o fim precisa ser depois do início`);H.push({prof_id:UID,dia:d,inicio:v['a'+d],fim:v['b'+d]})}
      if(v['c'+d]&&v['d'+d]){if(v['d'+d]<=v['c'+d])return toast(`${DL[d]}: o fim precisa ser depois do início`);if(v['c'+d]<v['b'+d])return toast(`${DL[d]}: o segundo período precisa começar depois do primeiro`);H.push({prof_id:UID,dia:d,inicio:v['c'+d],fim:v['d'+d]})}}
    let r=await sb.from('horarios').delete().eq('prof_id',UID);if(r.error)return toast(errTxt(r.error));if(H.length){r=await sb.from('horarios').insert(H);if(r.error)return toast(errTxt(r.error))}
    await loadProf();render();return toast(H.length?'Horários salvos':'Sem dias de atendimento: seu link não mostrará horários')}
  if(f.id==='fregras'){const row={intervalo_min:+v.intervalo_min,antecedencia_h:+v.antecedencia_h,janela_dias:+v.janela_dias,cancel_h:+v.cancel_h};const {error}=await sb.from('profissionais').update(row).eq('id',UID);if(error)return toast(errTxt(error));Object.assign(PROF,row);return toast('Regras salvas')}
  if(f.id==='fcan'){const c={alarme:true,email:!!v.email,whats:!!v.whats};const {error}=await sb.from('profiles').update({canais:c}).eq('id',UID);if(error)return toast(errTxt(error));ME.canais=c;return toast('Preferências salvas')}
});
/* atualiza a agenda quando volta para o app */
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&UID&&PROF&&!SLUG&&!$('#modal.on')){await loadProf();render()}});
setInterval(async()=>{if(document.visibilityState==='visible'&&UID&&PROF&&!SLUG&&!$('#modal.on')&&!$('.cc.on')&&!document.activeElement?.matches('input,textarea,select')){await loadProf();render()}},60000);

/* ===== início ===== */
(async()=>{
  if(/type=recovery/.test(location.hash))REC=true;
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){REC=true;render()}});
  try{
    if(SLUG)await loadPub();
    await loadMe();
    if(UID&&!SLUG&&pushOk())ativarPush(true);
  }catch(e){toast(errTxt(e))}
  render();setTimeout(()=>$('#splash').classList.add('out'),350);setTimeout(()=>$('#splash').remove(),900);
})();
</script>
