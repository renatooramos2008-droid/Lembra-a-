<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">

<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calmo, confiável, utilitário — uma secretária que não deixa nada passar
IDEA: o talão de lembretes de bolso: cada conta é um canhoto com data, valor e ação
PICTURE: a própria lista de avisos do dia, grande, logo no topo
COLOUR and TYPE: esmeralda da marca em faixas, branco, tinta escura; Plus Jakarta Sans
LAYOUT: barra lateral no desktop, barra inferior no celular, cartões em uma ou duas colunas */
:root{color-scheme:light dark;--bg:light-dark(#f5f8f6,#0b1310);--card:light-dark(#fff,#131f19);--ink:light-dark(#0f1a15,#e6efe9);--mute:light-dark(#5b6a62,#93a59b);--line:light-dark(#e2e9e5,#22332b);--g:#0f9d6b;--gd:light-dark(#0b7a53,#3fd39a);--g2:light-dark(#e2f5ec,#163a2a);--warn:light-dark(#fff2d3,#3a2f12);--warnk:light-dark(#8a5a00,#f3c463);--bad:light-dark(#fde5e3,#3d1817);--badk:light-dark(#b42318,#ff8f85)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,p{margin:0}h1{font-size:clamp(26px,4vw,36px);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:19px;margin:28px 0 12px;display:flex;align-items:center;gap:8px}h3{font-size:17px;font-weight:700}
a{color:var(--gd)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;margin:0 6px 24px}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--g);display:grid;place-items:center}
nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;min-height:44px}
nav a.on{background:var(--g);color:#fff}nav a svg{width:20px;height:20px}
main{padding:clamp(18px,3vw,40px);max-width:1100px;width:100%;margin:0 auto;padding-bottom:110px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sub{color:var(--mute);margin-top:4px}
.banner{background:var(--g);color:#fff;border-radius:20px;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.banner b{font-size:clamp(28px,5vw,40px);line-height:1}.banner p{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.bill,.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.bt{display:flex;justify-content:space-between;gap:10px}.who{font-size:13px;color:var(--gd);font-weight:700}
.val{font-size:18px;white-space:nowrap}.bt small{color:var(--mute);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 12px;font-size:13px}
.tag{padding:3px 10px;border-radius:99px;background:var(--g2);color:var(--gd);font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn);color:var(--warnk)}.tag.bad{background:var(--bad);color:var(--badk)}.tag.soft{background:transparent;border:1px solid var(--line);color:var(--mute)}
.mut{color:var(--mute)}
.acts{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}.btn.dang{color:var(--badk)}
.btn svg{width:17px;height:17px}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.empty{color:var(--mute);padding:18px;border:1px dashed var(--line);border-radius:16px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;flex-wrap:wrap}
.row .r{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:44px}
.filters input{flex:1 1 200px;width:auto}.filters select{width:auto;flex:0 1 auto}
label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}label input,label select,label textarea{margin-top:5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}.check input{width:22px;min-height:22px;margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.stat b{display:block;font-size:clamp(24px,3.5vw,32px);line-height:1.1;margin-top:4px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 110px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar i{display:block;height:14px;border-radius:99px;background:var(--g)}.bar span:last-child{text-align:right;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:13px}
.cal button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:44px;cursor:pointer;padding:2px}
.cal button.has{background:var(--g2);font-weight:700}.cal button.td{outline:2px solid var(--g)}.cal button.sel{background:var(--g);color:#fff}
.cal em{display:block;font-style:normal;font-size:11px;color:var(--gd)}.cal .sel em{color:#fff}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}.tl p{margin-bottom:10px;font-size:14px}
#modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}
#modal[hidden]{display:none}.sheet{background:var(--card);border-radius:20px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--g)}
.login .sheet{width:min(440px,100%)}.login h1{margin:14px 0 6px}
.mobnav{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--ink);min-height:44px;padding:0 14px;cursor:pointer}.seg .on{background:var(--g);color:#fff}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcal>span{text-align:center;font-size:12px;color:var(--mute);font-weight:700}
.mcal button{font:inherit;font-size:14px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:58px;padding:6px;cursor:pointer;display:flex;flex-direction:column}
.mcal button.out{opacity:.4}.mcal button b{align-self:flex-start}.mcal button.td b{background:#e5484d;color:#fff;border-radius:99px;padding:0 6px}.mcal button.sel{outline:2px solid var(--g);outline-offset:-1px}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}.dots i{width:7px;height:7px;border-radius:50%}
.it{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;cursor:pointer}
.it .c{width:4px;align-self:stretch;border-radius:4px;flex:none}.it .tm{width:62px;flex:none;font-size:13px;color:var(--mute);font-weight:600}.it p{font-size:13px;color:var(--mute)}
.hr{display:grid;grid-template-columns:52px minmax(0,1fr);border-top:1px solid var(--line);min-height:46px;gap:8px}.hr>span{font-size:12px;color:var(--mute);padding-top:4px}.hr.now{border-top:2px solid #e5484d}.hr .it{margin:4px 0}
.dayh{font-weight:700;margin:18px 0 8px}.dayh::first-letter,.cap::first-letter{text-transform:uppercase}
.sw{width:22px;height:22px;border-radius:50%;display:inline-block;flex:none}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.colors label{margin:0}.colors input{position:absolute;opacity:0;width:1px;min-height:0}.colors input:checked+.sw{outline:3px solid var(--ink);outline-offset:2px}
.kv p{margin-bottom:8px}.kv b{display:inline-block;min-width:96px;color:var(--mute);font-weight:600}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{display:none}
.mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:10;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.mobnav a{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center}.mobnav a.on{background:var(--g2);color:var(--gd)}}
@media(max-width:600px){.two{grid-template-columns:1fr}.bar{grid-template-columns:80px minmax(0,1fr) 90px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
/* ===== Visual branco com botões flutuantes ===== */
:root,:root[data-theme=dark],:root[data-theme=light]{color-scheme:light;--bg:#fff;--card:#fff;--ink:#111;--mute:#6b6f6d;--line:#ececec;--g:#0f9d6b;--gd:#0b7a53;--g2:#eafaf2;--warn:#fff4d6;--warnk:#8a5a00;--bad:#fdebea;--badk:#b42318;--sh:0 12px 22px -8px rgba(0,0,0,.45);--sh2:0 18px 40px -18px rgba(0,0,0,.28)}
body{background:#fff}
aside{border-right:0;box-shadow:8px 0 30px -24px rgba(0,0,0,.4)}
.bill,.box,.row,.it{border:1px solid #f0f0f0;box-shadow:var(--sh2)}
.row,.it{transition:transform .15s}.row:hover,.it:hover{transform:translateY(-2px)}
.btn{border:1.5px solid #111;background:#fff;color:#111;border-radius:14px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 26px -8px rgba(0,0,0,.5)}.btn:active{transform:translateY(1px);box-shadow:0 4px 10px -4px rgba(0,0,0,.5)}
.btn.pri{background:#111;border-color:#111;color:#fff}.btn.wa{background:var(--g);border-color:#111;color:#fff}.btn.dang{color:var(--badk);border-color:var(--badk)}
.banner{background:#fff;color:#111;border:1.5px solid #111;box-shadow:var(--sh)}.banner b{color:var(--g)}
nav a.on{background:#111;color:#fff;box-shadow:var(--sh)}.mobnav a.on{background:#111;color:#fff}
.logo i{background:#111;color:#fff;box-shadow:var(--sh)}
.seg{border:1.5px solid #111;box-shadow:var(--sh)}.seg .on{background:#111}
input,select,textarea{background:#fafafa;border:1.5px solid #e6e6e6}input:focus,select:focus,textarea:focus{border-color:#111;outline:0;background:#fff}
.sheet{box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:22px}
.quick .btn{min-height:64px;justify-content:center;font-size:16px}
#splash{position:fixed;inset:0;z-index:50;background:#fff;display:grid;place-items:center;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash .mk{display:flex;flex-direction:column;align-items:center;gap:18px}
#splash .ico{width:92px;height:92px;border-radius:26px;background:#111;display:grid;place-items:center;box-shadow:0 22px 40px -14px rgba(0,0,0,.55);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
#splash .ico svg{width:50px;height:50px;color:#fff;transform-origin:50% 10%;animation:ring .7s .35s ease-in-out both}
#splash .nm{font-size:34px;font-weight:800;letter-spacing:-.02em;display:flex}
#splash .nm span{display:inline-block;opacity:0;transform:translateY(12px);animation:up .35s ease-out forwards}
#splash .dot{color:var(--g)}
#splash .bar{width:120px;height:4px;border-radius:9px;background:#eee;overflow:hidden}#splash .bar i{display:block;height:100%;width:0;background:#111;animation:load .9s .2s ease-out forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
@keyframes up{to{opacity:1;transform:none}}@keyframes load{to{width:100%}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:22px 0 4px}.tabs button{min-height:50px;font-size:15px}
label.check.row{justify-content:flex-start;flex-wrap:nowrap;align-items:flex-start;margin-bottom:8px}label.check.row:hover{transform:none}
details.more{margin:4px 0 14px;border-top:1px solid var(--line);padding-top:10px}details.more summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.who-card{display:flex;gap:16px;align-items:center;margin-top:24px}.who-card .av{width:60px;height:60px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none;box-shadow:var(--sh)}
/* tema escuro */
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.theme-opt{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer;box-shadow:var(--sh2);min-height:44px}
.theme-opt.on{border-color:var(--ink);box-shadow:var(--sh)}
.prev{display:grid;gap:5px;width:100%;padding:10px;border-radius:10px;border:1px solid #ddd}.prev i{display:block;height:8px;border-radius:9px}
.prev.light{background:#fff}.prev.light i{background:#e8e8e8}.prev.light i:first-child{background:#111;width:50%}
.prev.dark{background:#0e0f0f;border-color:#333}.prev.dark i{background:#2a2d2e}.prev.dark i:first-child{background:#fff;width:50%}
:root[data-tema=dark]{color-scheme:dark;--bg:#0e0f0f;--card:#17191a;--ink:#f3f3f3;--mute:#a1a7a4;--line:#2a2d2e;--gd:#3fd39a;--g2:#163a2a;--warn:#3a2f12;--warnk:#f3c463;--bad:#3d1817;--badk:#ff8f85;--sh:0 12px 22px -8px rgba(0,0,0,.9);--sh2:0 18px 40px -18px rgba(0,0,0,.8)}
[data-tema=dark] body,[data-tema=dark] #splash,[data-tema=dark] .onb{background:var(--bg)}
[data-tema=dark] .bill,[data-tema=dark] .box,[data-tema=dark] .row,[data-tema=dark] .it{border-color:var(--line)}
[data-tema=dark] .btn{background:var(--card);color:var(--ink);border-color:#f3f3f3}
[data-tema=dark] .btn.pri,[data-tema=dark] nav a.on,[data-tema=dark] .mobnav a.on,[data-tema=dark] .seg .on{background:#fff;color:#111;border-color:#fff}
[data-tema=dark] .btn.wa{background:var(--g);color:#fff}
[data-tema=dark] .banner{background:var(--card);color:var(--ink);border-color:#f3f3f3}
[data-tema=dark] .seg{border-color:#f3f3f3}
[data-tema=dark] .logo i,[data-tema=dark] .who-card .av,[data-tema=dark] #splash .ico{background:#fff;color:#111}
[data-tema=dark] #splash .ico svg{color:#111}
[data-tema=dark] input,[data-tema=dark] select,[data-tema=dark] textarea{background:#202324;border-color:#2f3334;color:var(--ink)}
[data-tema=dark] input:focus,[data-tema=dark] select:focus,[data-tema=dark] textarea:focus{border-color:#f3f3f3;background:#1a1c1d}
[data-tema=dark] .art{background:#151717}
[data-tema=dark] .steps i{background:#2a2d2e}[data-tema=dark] .steps i.on{background:#fff}
[data-tema=dark] #toast{background:#fff;color:#111}
[data-tema=dark] aside{box-shadow:8px 0 30px -20px #000}
/* investimentos */
.health{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.gauge{--p:0;--c:var(--g);width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;align-content:center;background:radial-gradient(closest-side,var(--card) 79%,transparent 80% 100%),conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.gauge b{font-size:34px;line-height:1}.gauge span{font-size:12px;color:var(--mute)}
.hitem{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.hitem:last-child{border:0}
.hico{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
/* perguntas iniciais */
.setup{max-width:720px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px) 60px}
.setup h1{margin:6px 0 8px}
.qchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px;margin-top:22px}
.qchip{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:76px;box-shadow:var(--sh2);transition:transform .12s}
.qchip span{font-size:13px;color:var(--mute)}.qchip.on{border-color:var(--ink);box-shadow:var(--sh);transform:translateY(-2px)}.qchip.on strong::before{content:"✓ ";color:var(--g)}
.qrow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);margin:0}
.ql{font-weight:700}.qf{display:flex;gap:8px}.qf>*{flex:1 1 0;min-width:0}
.qnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.qnav .btn.pri{flex:1;justify-content:center;min-height:52px}
.qdone{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.qdone:last-child{border:0}
label.check.qrow{display:flex;gap:12px;align-items:flex-start}
@media(max-width:600px){.qrow{grid-template-columns:1fr;gap:6px}.qf{flex-wrap:wrap}.qf input[type=date]{flex:1 1 100%}}
/* login com arte */
.onb{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#fff}
.art{background:#f4f6f5;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden}
.art svg{width:min(440px,100%);height:auto}
.qa{display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,72px);max-width:560px}
.qa h1{font-size:clamp(28px,4vw,40px);margin:14px 0 8px}.qa .big{font-size:18px;padding:14px 16px;min-height:56px}
.steps{display:flex;gap:6px;margin:18px 0}.steps i{height:6px;flex:1;border-radius:9px;background:#eee}.steps i.on{background:#111}
.qa .btn{min-height:54px;font-size:16px;justify-content:center}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font:inherit;font-weight:700;color:var(--mute);cursor:pointer;min-height:44px;padding:0 10px}
@media(max-width:820px){.onb{grid-template-columns:1fr}.art{padding:24px 24px 8px;min-height:0}.art svg{width:min(300px,80%)}}
</style>
</head>
<body>
<div id="splash" aria-label="Lembra Aí"><div class="mk"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></div><div class="nm" id="spname"></div><div class="bar"><i></i></div></div></div>
<div id="root"></div>

const longD=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
function occurs(e,day){
  const b=e.ini.slice(0,10),n=dd(day,b);if(n<0||(e.ex||[]).includes(day)||(e.repAte&&day>e.repAte))return false;
  const span=dd(e.fim.slice(0,10),b);
  switch(e.rep){case 'Diariamente':return true;case 'Dias úteis':{const w=new Date(day+'T12:00:00').getDay();return w>0&&w<6}
    case 'Semanalmente':return n%7===0;case 'A cada 2 semanas':return n%14===0;case 'Mensalmente':return day.slice(8)===b.slice(8);case 'Anualmente':return day.slice(5)===b.slice(5);default:return n<=Math.max(0,span)}
}
function dayItems(day){
  const ev=S.evs.filter(e=>calOn(e.cal)&&occurs(e,day)).map(e=>({k:'e',e,t:e.allDay||e.ini.slice(0,10)!==day&&e.rep==='Nunca'?'':e.ini.slice(11,16),cor:calOf(e.cal).cor}));
  const ct=calOn('contas')?S.contas.filter(x=>x.status!=='Pago'&&x.venc===day).map(x=>({k:'c',x,t:'',cor:calOf('contas').cor})):[];
  return [...ev,...ct].sort((a,b)=>(a.t||'').localeCompare(b.t||''));
}
function item(it,day){
  if(it.k==='c'){const x=it.x;return `<div class="it" data-edit-conta="${x.id}"><i class="c" style="background:${it.cor}"></i><span class="tm">dia inteiro</span><div><h3>💰 ${esc(x.nome)} · ${brl(x.valor)}</h3><p>${esc(x.cat)} · ${when(x)}</p></div></div>`}
  const e=it.e;return `<div class="it" data-ev="${e.id}|${day}"><i class="c" style="background:${it.cor}"></i><span class="tm">${it.t?esc(it.t)+'<br>'+esc(e.fim.slice(11,16)):'dia inteiro'}</span><div><h3>${esc(e.titulo)}</h3><p>${[e.local,e.rep!=='Nunca'?'↻ '+e.rep:'',calOf(e.cal).nome].filter(Boolean).map(esc).join(' · ')}</p></div></div>`;
}
function startOf(e,day){return new Date(day+'T'+(e.allDay?'09:00':e.ini.slice(11,16))+':00').getTime()}
function alertsIn(from,to){
  const out=[];for(let i=-1;i<=8;i++){const day=addD(i);S.evs.forEach(e=>{if(!occurs(e,day))return;(e.alerts||[]).forEach(m=>{const at=startOf(e,day)-m*60000;if(at>=from&&at<=to)out.push({e,day,m,at,key:e.id+'|'+day+'|'+m})})})}
  S.contas.filter(x=>x.status!=='Pago').forEach(x=>{const e={titulo:'💰 '+x.nome+' · '+brl(x.valor),allDay:true,local:'',ini:x.venc+'T00:00',fim:x.venc+'T23:59',conta:x.id};[[x.dias,x.dias+' dia'+(x.dias>1?'s':'')+' antes'],[0,'Vence hoje']].forEach(([n,l])=>{const at=new Date(addDs(x.venc,-n)+'T09:00:00').getTime();if(at>=from&&at<=to)out.push({e,day:x.venc,m:n*1440,lbl:l,at,key:'c|'+x.id+'|'+x.venc+'|'+n})})});
  return out.sort((a,b)=>a.at-b.at);
}
const whenEv=(e,day)=>e.allDay?longD(day)+' · dia inteiro':longD(day)+' · '+e.ini.slice(11,16)+'–'+e.fim.slice(11,16);

function gcal(e,day){const f=s=>s.replace(/[-:]/g,'');const dEnd=addDs(day,dd(e.fim.slice(0,10),e.ini.slice(0,10)));

  itens.push([!comR.length?'mid':neg>.2?'bad':neg>0?'mid':'ok','Rendimento',!comR.length?'Sem dados de rendimento ainda (chegam pelo banco conectado).':neg?`${Math.round(neg*100)}% do valor está com rendimento negativo nos últimos 12 meses.`:'Nenhum investimento com rendimento negativo em 12 meses.']);
  const v=a.var,r4=v==null?.5:v>.15?0:v>0?.5:1;pts+=r4*20;

  const score=Math.round(pts),nivel=score>=70?['Saudável','ok']:score>=45?['Atenção','mid']:['Precisa de cuidado','bad'];

}

  if(d.seqgo){const x=conta(d.seqgo);x.status='Avisado';S.hist.push({id:uid(),contaId:x.id,cid:x.cid,nome:x.nome,tipo:tipoAviso(x),valor:x.valor,data:today()});save();seqList.shift();setTimeout(seqNext,400);return}
  if('seqskip' in d){seqList.shift();return seqNext()}
  if('seq' in d){seqList=S.contas.filter(x=>x.status==='Pendente'&&(diff(x.venc)<0||diff(x.venc)<=x.dias)).sort((a,b)=>a.venc.localeCompare(b.venc)).map(x=>x.id);return seqNext()}
  if(d.pago)return pagar(d.pago);
  if(d.pix)return copy(conta(d.pix).pix,'Pix copiado');
  if(d.go){location.hash=d.go;return}
  if('newConta' in d)return formConta(null,d.newConta);
  if(d.editConta)return formConta(conta(d.editConta));
  if(d.delConta)return ask('Excluir esta conta?',()=>{S.contas=S.contas.filter(x=>x.id!==d.delConta);save();render();toast('Conta excluída')});
  if('newCli' in d)return formCli();
  if(d.editCli)return formCli(cli(d.editCli));
  if(d.delCli)return ask('Excluir este cliente e todas as contas dele?',()=>{S.clients=S.clients.filter(c=>c.id!==d.delCli);S.contas=S.contas.filter(x=>x.cid!==d.delCli);save();location.hash='clientes';toast('Cliente excluído')});
  if(d.assin){cli(d.assin).status='Assinante';save();render();return toast('Agora é assinante 🎉')}
  if(d.day!==undefined){const n=+d.day;F.day=F.day===n||!n?0:n;return render()}
  if('close' in d){seqList=[];closeM();return render()}
  if('sair' in d)return ask('Sair da conta? Seus dados ficam guardados no servidor.',()=>{sb.auth.signOut();UID=null;S=norm(null);O.mode='';O.alt=false;location.hash='';render()});
  if('copyBk' in d)return copy(JSON.stringify(S),'Backup copiado');
  if('imp' in d)return openM(`<form><h3>Importar backup</h3><label style="margin-top:12px">Cole aqui o texto do backup<textarea name="j" rows="6" required></textarea></label><p class="err" style="color:var(--badk);font-size:14px"></p><div class="acts" style="border:0;padding:0"><button class="btn pri">Importar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`,(v,f)=>{try{const o=JSON.parse(v.j);if(!Array.isArray(o.contas)||!Array.isArray(o.clients))throw 0;S=norm({...blank(),...o,user:S.user,session:true});save();closeM();render();toast('Backup importado')}catch(x){f.querySelector('.err').textContent='Texto de backup inválido.'}});
  if('seed' in d)return ask('Trocar tudo pelos dados de exemplo?',()=>{seed();render();toast('Dados de exemplo restaurados')});
  if('wipe' in d)return ask('Apagar todas as contas e compromissos? Seu login continua.',()=>{S.contas=[];S.hist=[];S.evs=[];S.fired=[];S.clients=S.clients.filter(c=>c.me);save();render();toast('Tudo apagado')});
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-tel]')){t.value=fmtTel(t.value);return}
  if(t.matches('[data-ddd]')){t.value=digits(t.value).slice(0,2);if(t.value.length===2){const n=t.parentNode.querySelector('[data-num]');if(n)n.focus()}return}
  if(t.matches('[data-num]')){const d=digits(t.value).slice(0,9);t.value=d.length>5?d.slice(0,5)+'-'+d.slice(5):d;return}
  if(t.id==='aq'){A.q=t.value;render();const n=$('#aq');n.focus();n.setSelectionRange(n.value.length,n.value.length);return}
  if(t.id==='fq'){F.q=t.value;render();const n=$('#fq');n.focus();n.setSelectionRange(n.value.length,n.value.length)}
});
document.addEventListener('change',e=>{
  const m={ft:'tipo',fs:'st',fc:'cli',fk:'cat',fx:'sts'}[e.target.id];if(m){F[m]=e.target.value;render()}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(f.closest('#mbody'))return;e.preventDefault();const v=Object.fromEntries(new FormData(f));
  if(f.id==='fsetup'){const k=f.dataset.sec;Q.ans[k]={};ROWS[k].forEach(r=>{const a={};['dia','valor','data','nome','parc','forma','on'].forEach(x=>{const val=v[r[0]+'__'+x];if(val!==undefined&&val!=='')a[x]=val});Q.ans[k][r[0]]=a});
    if(k==='carro'){S.carro={placa:String(v.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,''),uf:v.uf||''}}
    S.contas=S.contas.filter(x=>!(x.src==='setup'&&x.sec===k)).concat(ROWS[k].map(r=>qBuild(k,r,Q.ans[k][r[0]])).filter(Boolean));
    save();Q.i++;return render()}
  if(f.id==='fstep'){(async()=>{const st=STEPS[O.step],val=String(v.v||'').trim(),err=t=>$('#lerr').textContent=t;
    if(st[0]==='nome'&&val.length<2)return err('Digite seu nome.');
    if(st[0]==='whats'){const pe=phoneErr(v.ddd,v.num);if(pe)return err(pe);O.v.whats=digits(v.ddd)+digits(v.num);O.step++;return render()}
    if(st[0]==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val))return err('Esse e-mail não parece certo.');
    if(st[0]==='senha'&&val.length<6)return err('A senha precisa de pelo menos 6 caracteres.');
    O.v[st[0]]=st[0]==='whats'?digits(val):val;
    if(O.step<STEPS.length-1){O.step++;return render()}
    const em=O.v.email.toLowerCase(),btn=f.querySelector('button.pri');btn.disabled=true;btn.textContent='Criando conta…';
    const {data,error}=await sb.auth.signUp({email:em,password:O.v.senha,options:{data:{nome:O.v.nome,whatsapp:O.v.whats,tipo:O.v.tipo,lgpd:'true'}}});
    btn.disabled=false;btn.textContent='Criar conta e ativar lembretes';
    if(error)return err(netMsg(error)||(/registered|already/i.test(error.message)?'Esse e-mail já tem conta. Toque em "Entrar".':/password/i.test(error.message)?'Senha fraca. Use pelo menos 6 caracteres.':'Não foi possível criar a conta: '+error.message));
    if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)return err('Esse e-mail já tem conta. Toque em "Entrar".');
    if(!data.session){const r2=await sb.auth.signInWithPassword({email:em,password:O.v.senha});if(!r2.error&&r2.data.session)data.session=r2.data.session}
    if(!data.session){let a=ACC.list.find(x=>x.id===em);if(!a){a={id:em};ACC.list.unshift(a)}Object.assign(a,{nome:O.v.nome,email:em,whats:O.v.whats});ACC.last=em;saveAcc();
      O.step=0;O.mode='entrar';O.alt=false;O.v={tipo:'Pessoa'};render();toast('Enviamos um link para '+em+'. Confirme o e-mail e depois entre com sua senha.');return}
    try{await loadUser()}catch(x){return err(netMsg(x)||'Conta criada, mas não deu para carregar os dados. Entre de novo.')}
    S.needSetup=true;Q.i=0;Q.sel=[];Q.ans={};O.step=0;O.mode='';O.alt=false;O.v={tipo:'Pessoa'};
    save();location.hash='hoje';render();toast('Conta criada · lembretes para '+fmtTel(S.user.whats))})()}
  if(f.id==='fentrar'){(async()=>{const byMail='email' in v,email=byMail?v.email.trim().toLowerCase():curAcc()?.email,fail=t=>{$('#lerr').textContent=t;const p=$('#pw-senha');if(p){p.value='';p.focus()}};
    if(!email)return fail('Toque em "Criar conta" para começar.');
    const b=f.querySelector('button.pri');b.disabled=true;b.textContent='Entrando…';
    const {error}=await sb.auth.signInWithPassword({email,password:v.senha});b.disabled=false;b.textContent='Entrar';
    if(error)return fail(netMsg(error)||(/confirm/i.test(error.message)?'Confirme seu e-mail pelo link que enviamos antes de entrar.':byMail?'E-mail ou senha incorretos.':'Senha incorreta. Tente de novo.'));
    try{await loadUser()}catch(x){return fail(netMsg(x)||'Não foi possível carregar seus dados. Tente de novo.')}
    O.alt=false;O.mode='';location.hash='hoje';render();toast('Bem-vindo, '+first(S.user.nome));ativarPush(true);if(PEND){abrirDet(PEND);PEND=''}else setTimeout(oferecerBio,900)})()}
  if(f.id==='fme'){const pe=phoneErr(v.ddd,v.num);if(pe)return toast(pe);const d=digits(v.ddd)+digits(v.num);if(v.senha&&v.senha.length<6)return toast('A senha precisa de 6 caracteres');
    (async()=>{const {error}=await sb.from('profiles').update({nome:v.nome,whatsapp:d}).eq('id',UID);if(error)return toast(netMsg(error)||'Não foi possível salvar: '+error.message);
      if(v.senha){const r=await sb.auth.updateUser({password:v.senha});if(r.error)return toast('Senha não alterada: '+r.error.message)}
      S.user.nome=v.nome;S.user.whats=d;const me=S.clients.find(c=>c.me);if(me)Object.assign(me,{nome:v.nome,whats:d});remember();save();render();toast('Conta atualizada')})()}
  if(f.id==='fcan'){if(!v.alarme&&!v.whats&&!v.email)return toast('Escolha pelo menos um jeito de receber');S.cfg.canais={alarme:!!v.alarme,whats:!!v.whats,email:!!v.email};sb.from('profiles').update({canais:S.cfg.canais}).eq('id',UID).then(()=>{});S.cfg.dias=+v.dias||0;save();render();toast('Preferências salvas')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden){seqList=[];closeM()}});
window.addEventListener('hashchange',render);
render();
setInterval(tick,30000);setTimeout(tick,1800);
}
</script>
